services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clenzey
      POSTGRES_PASSWORD: clenzey_secret
      POSTGRES_DB: clenzey
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clenzey"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://clenzey:clenzey_secret@db:5432/clenzey
      REDIS_URL: redis://redis:6379
      PORT: 3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/src/workers/index.js"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://clenzey:clenzey_secret@db:5432/clenzey
      REDIS_URL: redis://redis:6379
    # Worker has no HTTP server; override the image HEALTHCHECK (backend /health/ready).
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  pgdata:
  redisdata:
